name: Deploy realtime-server to Fly.io

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "realtime-server/**"
      - ".github/workflows/fly-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-${{ github.ref_name }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to studyquest (prod)
        if: github.ref_name == 'main'
        run: flyctl deploy --remote-only -a studyquest
        working-directory: realtime-server
      - name: Deploy to studyquest-prev (dev)
        if: github.ref_name == 'dev'
        run: flyctl deploy --remote-only -a studyquest-prev
        working-directory: realtime-server
